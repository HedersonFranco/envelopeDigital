[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envelope-digital-assinado"
version = "1.0.0"
description = "Envelope digital assinado (AES-256-CBC + RSA-OAEP + assinatura RSA, Encrypt-then-Sign) interoperável com o CyberChef."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Hederson Franco Benvindo Lima" },
    { name = "João Guilherme Oliveira Pereira" },
    { name = "David Soares Pereira Junior" },
]
keywords = ["criptografia", "envelope digital", "rsa", "aes", "assinatura digital", "cyberchef"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
envelope = "envelope_digital.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
